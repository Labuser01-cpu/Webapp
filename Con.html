<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Form</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #4a4a4a;
        }

        .input-group {
            margin: 10px 0;
            text-align: left;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #764ba2;
        }

        .submit-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #5a67d8;
        }

        .message {
            margin-top: 10px;
            padding: 10px;
            display: none;
            font-size: 14px;
            border-radius: 5px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Submit Your Details</h2>
        <form id="myForm">
            <div class="input-group">
                <label for="firstname">First Name</label>
                <input type="text" name="firstname" id="firstname" required>
            </div>

            <div class="input-group">
                <label for="lastname">Last Name</label>
                <input type="text" name="lastname" id="lastname" required>
            </div>

            <button type="submit" class="submit-btn" id="mySubmit">Submit</button>
        </form>

        <p class="message" id="myConf"></p>
    </div>

    <script>
        $(document).ready(function () {
            var scriptURL = "https://script.google.com/macros/s/AKfycbzDgETJ2RkMLvfFoiCX8up8vQ0BeJZnagHLzv1Zk6v5w2BXVFruHQtInbtSxrNPGVWN/exec"; // Replace with your actual Web App URL

            $("#myForm").submit(function (event) {
                event.preventDefault(); // Prevent default form submission

                $.ajax({
                    url: scriptURL,
                    type: "POST",
                    data: $(this).serialize(),
                    dataType: "json",
                    success: function (response) {
                        if (response.status === "success") {
                            $("#myConf").removeClass("error").addClass("success").text("✅ Submitted successfully!").slideDown();
                            $("#myForm")[0].reset(); // Clear form inputs
                        } else {
                            $("#myConf").removeClass("success").addClass("error").text("❌ Error: " + response.message).slideDown();
                        }
                    },
                    error: function () {
                        $("#myConf").removeClass("success").addClass("error").text("❌ Submission failed. Try again.").slideDown();
                    }
                });
            });
        });
    </script>

</body>
</html>
